    "Our story begins on the ocean, with wind and rain and thunder and lightning and waves. A hurricane roared and raged through the night. And in the middle of the chaos, a cargo ship was sinking down, down, down to the ocean floor.",

function reader(){return `<div class="reader"><div class="readerhero"><div style="font-size:13px;font-weight:800;letter-spacing:2px;color:#ffd37a">THE WILD ROBOT · CHAPTER 1</div><h1>THE OCEAN 🌊</h1><p>원문 읽기 · 폭풍, 침몰한 화물선, 그리고 살아남은 로봇</p><div class="reader-controls"><button class="navbtn" id="readAll">🔊 전체 듣기</button><button class="navbtn" id="stopAudio">■ 음성 정지</button><button class="navbtn" id="startCards">🃏 단어 공부 시작 →</button></div></div><p class="note" style="padding-top:14px">2026년 11월 7일에 보내주신 책 스크린샷(IMG_0014, IMG_0015)을 바탕으로 작성했습니다. 문단별 🔊 버튼을 눌러 소리 내어 듣고 따라 읽어 보세요.</p>${DATA.paragraphs.map((p,i)=>`<div class="readerpara"><div class="readertop"><span class="pno">PARAGRAPH ${i+1} / 7</span><button class="audio" data-speak="${encodeURIComponent(p)}">🔊 문단 듣기</button></div><p>${safe(p)}</p></div>`).join('')}<div class="readerfooter">The Wild Robot · Peter Brown · Chapter 1 · 학습용 원문 보기</div><div style="margin-top:20px"><button class="primary" id="endCards">단어카드 학습 시작 →</button></div></div>`}
function render(){const done=state.done.length;$('#totalcount').textContent=DATA.words.length;$('#progressbar').style.width=(done/DATA.words.length*100)+'%';$('#progresslabel').textContent=`암기 완료 ${done}개 / ${DATA.words.length}개 · 즐겨찾기 ${state.fav.length}개`;const items=filtered();$('#wordlist').innerHTML=items.map(w=>`<div class="worditem ${w.id===idx&&tab!=='reader'?'selected':''}"><button class="wordtitle" data-select="${w.id}"><strong>${safe(w.word)}</strong><small>${safe(w.meaning)}</small></button><button data-speak="${encodeURIComponent(w.word.split('–')[0])}" aria-label="발음 듣기">🔊</button><button class="${state.fav.includes(w.id)?'star':''}" data-toggle="fav" data-id="${w.id}" aria-label="즐겨찾기">${state.fav.includes(w.id)?'★':'☆'}</button><button class="${state.done.includes(w.id)?'done':''}" data-toggle="done" data-id="${w.id}" aria-label="암기완료">${state.done.includes(w.id)?'✓':'○'}</button></div>`).join('')||'<div class="empty">단어가 없어요</div>';$('#main').innerHTML=tab==='reader'?reader():cards()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.filter){filter=b.dataset.filter;tab='cards';document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.tab==='cards'));document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));render();return}if(b.dataset.speak){speak(decodeURIComponent(b.dataset.speak));return}if(b.dataset.select!==undefined){idx=+b.dataset.select;setTab('cards');return}if(b.dataset.toggle){toggle(b.dataset.toggle,+b.dataset.id);return}if(b.id==='prev')navigate(-1);if(b.id==='next')navigate(1);if(b.id==='startCards'||b.id==='endCards')setTab('cards');if(b.id==='stopAudio')speechSynthesis.cancel();if(b.id==='readAll')speak(DATA.paragraphs.join(' '));if(b.id==='listenAll'){const w=DATA.words[idx];speak([w.word.split('–')[0],...w.quotes,w.every].join('. '))}});$('#search').addEventListener('input',e=>{search=e.target.value;if(tab==='reader')setTab('cards');else render()});document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(tab!=='reader'&&e.key==='ArrowRight')navigate(1);if(tab!=='reader'&&e.key==='ArrowLeft')navigate(-1)});render();</script></body></html>
