function playIcon(){return '<span class="triangle" aria-hidden="true">▶</span>'}
function sentenceBlock(q,w,j){return `<div class="quote"><div class="quotehead"><span>${highlight(q,w.word)}</span><button class="audio" aria-label="원문 문장 재생" data-clip="q${idx}_${j}">${playIcon()}</button></div></div>`}
function chapterTitle(){return `<div class="chapter-head"><span>CHAPTER 01</span><strong>THE OCEAN</strong><small>바다와 폭풍</small></div>`}

let vocabMode='grid',vocabPage=0;
function vocabGrid(){
 const a=filtered();if(!a.length)return '<div class="empty">단어가 없어요.</div>';
 const pages=Math.ceil(a.length/10);vocabPage=Math.max(0,Math.min(vocabPage,pages-1));
 const selected=a.slice(vocabPage*10,vocabPage*10+10);
 return `<div class="vocab-grid-screen">
 <div class="vocab-grid-header"><div class="vocab-grid-heading"><div class="vocab-cover-art">🌊</div><div><div class="vocab-titleline"><span>Chapter 1</span><strong>The Ocean</strong></div><p>📖 &nbsp; Vocabulary · 총 ${a.length}개 단어</p></div></div>
 <button class="vocab-switch" id="showCards">▣ 카드로 학습</button></div>
 <div class="vocab-pagination"><button id="gridPrev" ${vocabPage===0?'disabled':''} aria-label="이전 10개 단어">‹</button><span>${vocabPage+1} / ${pages}</span><button id="gridNext" ${vocabPage===pages-1?'disabled':''} aria-label="다음 10개 단어">›</button></div>
 <div class="vocab-tile-grid">${selected.map(w=>`<article class="vocab-tile"><button class="vocab-tile-open" data-select="${w.id}" aria-label="${safe(w.word)} 상세 학습"><div class="vocab-tile-photo">${art(w.scene,w.word)}</div><div class="vocab-tile-body"><h3>${safe(w.word)}</h3><span>${safe(w.meaning)}</span><p>${highlight(w.every,w.word)}</p></div></button><button class="audio vocab-tile-audio" data-clip="w${w.id}" aria-label="${safe(w.word)} 음성 듣기">${playIcon()}</button></article>`).join('')}</div>
 <div class="vocab-grid-hint">그림을 누르면 큰 단어 카드가 열립니다.</div>
 <button class="vocab-exit" id="exitStudy">← 학습 종료</button></div>`;
}
function cards(){
 const a=filtered();if(!a.length)return '<div class="empty">단어가 없어요.</div>';if(!a.some(w=>w.id===idx))idx=a[0].id;
 const w=DATA.words[idx],j=a.findIndex(x=>x.id===idx);
 return `<div class="vocab-detail-screen"><div class="study-top"><button class="exit-study" id="exitStudy" aria-label="학습 종료">✕</button><span>CHAPTER 01 · THE OCEAN</span><button class="word-drawer" id="showGrid" aria-label="10개 단어 목록 보기">☰</button></div>
 <div class="vocab-detail-progress">${j+1} <span>/ ${a.length}</span></div>
 <div class="study-frame"><button class="edge-arrow left" id="prev" ${j===0?'disabled':''} aria-label="이전 단어">❮</button><div class="study-card"><div class="cardcontent">
 <div class="art">${art(w.scene,w.word)}</div>
 <div class="word-right"><div class="titleline"><h1 class="wordbig">${safe(w.word)}</h1><button class="audio" data-clip="w${idx}" aria-label="단어 발음 듣기">${playIcon()}</button></div>
 <div class="ipa">${safe(w.ipa)}</div><div class="meaning">${safe(w.meaning)}</div>
 <div class="vocab-example"><div>${highlight(w.every,w.word)}</div><small>${safe(w.everyKo)}</small><button class="audio" data-clip="e${idx}" aria-label="예문 듣기">${playIcon()}</button></div>
 <div class="actions"><button class="${state.fav.includes(idx)?'activeFav':''}" data-toggle="fav" data-id="${idx}">${state.fav.includes(idx)?'★':'☆'} 즐겨찾기</button><button class="${state.done.includes(idx)?'activeDone':''}" data-toggle="done" data-id="${idx}">${state.done.includes(idx)?'✓':'○'} 암기완료</button></div>
 <div class="section"><div class="sectionhead">책 속 문장</div><div class="secbody">${w.quotes.map((q,k)=>sentenceBlock(q,w,k)).join('')}</div></div></div></div></div>
 <button class="edge-arrow right" id="next" ${j===a.length-1?'disabled':''} aria-label="다음 단어">❯</button></div>
 <div class="vocab-detail-bottom"><button id="showGrid">▦ 10개 단어 목록 보기</button><small>화면을 좌우로 밀어 단어를 넘길 수 있습니다.</small></div></div>`;
}
function reader(){return `<div class="ebook"><div class="ebook-top"><button class="exit-study" id="exitStudy" aria-label="독서 종료">✕</button><div>THE WILD ROBOT <span>· CHAPTER 01</span></div><button class="audio" id="readAll" aria-label="원문 전체 재생">${playIcon()}</button></div><article class="ebook-pages"><div class="book-heading"><div>CHAPTER 1</div><h1>THE OCEAN</h1><small>바다와 폭풍</small></div>${DATA.paragraphs.map((p,i)=>`<p class="ebook-paragraph"><button class="paragraph-play audio" aria-label="문단 재생" data-clip="p${i}">${playIcon()}</button>${safe(p)}</p>`).join('')}<div class="book-end">✦</div><button class="primary ebook-next" id="startCards">단어 학습 시작 ❯</button></article></div>`}
function home(){return `<div class="home-page">${chapterTitle()}<div class="home-buttons"><button id="openReader" class="home-option"><span class="option-icon">📖</span><span><strong>책 읽기</strong><small>Chapter 1 원문</small></span><span class="option-go">❯</span></button><button id="openStudy" class="home-option"><span class="option-icon">✦</span><span><strong>단어 학습 시작</strong><small>${DATA.words.length}개 단어카드</small></span><span class="option-go">❯</span></button></div><div class="home-stats">암기완료 ${state.done.length} / ${DATA.words.length} · 즐겨찾기 ${state.fav.length}</div></div>`}
function render(){const done=state.done.length;$('#totalcount').textContent=DATA.words.length;$('#progressbar').style.width=(done/DATA.words.length*100)+'%';$('#progresslabel').textContent=`암기완료 ${done} / ${DATA.words.length} · 즐겨찾기 ${state.fav.length}`;const items=filtered();$('#wordlist').innerHTML=items.map(w=>`<div class="worditem ${w.id===idx&&tab==='cards'?'selected':''}"><button class="wordtitle" data-select="${w.id}"><strong>${safe(w.word)}</strong><small>${safe(w.meaning)}</small></button><button class="audio" data-clip="w${w.id}" aria-label="단어 재생">${playIcon()}</button><button class="${state.fav.includes(w.id)?'star':''}" data-toggle="fav" data-id="${w.id}" aria-label="즐겨찾기">${state.fav.includes(w.id)?'★':'☆'}</button><button class="${state.done.includes(w.id)?'done':''}" data-toggle="done" data-id="${w.id}" aria-label="암기완료">${state.done.includes(w.id)?'✓':'○'}</button></div>`).join('')||'<div class="empty">단어가 없어요</div>';
$('#main').innerHTML=tab==='reader'?reader():tab==='cards'?(vocabMode==='grid'?vocabGrid():cards()):home();document.body.classList.toggle('immersive',tab==='reader'||tab==='cards');document.body.classList.toggle('reader-open',tab==='reader');updatePlayerUI();updateAudioButtons()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.id==='showGrid'){vocabMode='grid';const at=filtered().findIndex(w=>w.id===idx);vocabPage=Math.max(0,Math.floor(Math.max(0,at)/10));stopClip();render();return}
if(b.id==='showCards'){vocabMode='card';stopClip();render();return}
if(b.id==='gridPrev'||b.id==='gridNext'){vocabPage+=b.id==='gridNext'?1:-1;stopClip();render();window.scrollTo({top:0,behavior:'smooth'});return}

if(b.dataset.clip){listen(b.dataset.clip,b.dataset.clip==='reader');return}
if(b.dataset.tab){stopClip();setTab(b.dataset.tab==='reader'?'home':b.dataset.tab==='cards'?'home':b.dataset.tab);return}
if(b.dataset.filter){filter=b.dataset.filter;tab='cards';vocabMode='grid';vocabPage=0;render();return}
if(b.dataset.select!==undefined){vocabMode='card';idx=+b.dataset.select;document.querySelector('#side').classList.remove('show-on-mobile');tab='cards';stopClip();render();return}
if(b.dataset.toggle){toggle(b.dataset.toggle,+b.dataset.id);return}
if(b.id==='toggleWordList'){document.querySelector('#side').classList.toggle('show-on-mobile');return}
if(b.id==='prev'){stopClip();navigate(-1);return}if(b.id==='next'){stopClip();navigate(1);return}
if(b.id==='openReader'){stopClip();setTab('reader');return}if(b.id==='openStudy'||b.id==='startCards'){vocabMode='grid';vocabPage=0;stopClip();setTab('cards');return}
if(b.id==='exitStudy'){stopClip();setTab('home');return}
if(b.id==='readAll'){listen('reader',true);return}
if(b.id==='pauseResume'){togglePause();return}if(b.id==='seekBack'){seekClip(-10);return}if(b.id==='playerSpeedToggle'){document.getElementById('speedToggle').click();b.setAttribute('aria-expanded',String(!document.getElementById('speed-panel').hidden));return}if(b.id==='seekForward'){seekClip(10);return}
});
$('#search').addEventListener('input',e=>{search=e.target.value;render()});
$('#play-progress').addEventListener('input',e=>seekProgress(Number(e.target.value)/1000));

// Card swipe navigation — touch/pointer, horizontal-only, ignore interactive controls.
(function(){
let swipeStart=null;
const root=document.getElementById('main');
root.addEventListener('pointerdown',function(e){
  if(tab!=='cards'||vocabMode!=='card'||!e.isPrimary||e.target.closest('button,input,textarea,select,a,[contenteditable]')){swipeStart=null;return;}
  if(e.pointerType==='mouse'&&e.button!==0){swipeStart=null;return;}
  if(!e.target.closest('.study-card')){swipeStart=null;return;}
  swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId,time:Date.now()};
},{passive:true});
root.addEventListener('pointerup',function(e){
  const start=swipeStart;swipeStart=null;
  if(!start||start.id!==e.pointerId||tab!=='cards')return;
  const dx=e.clientX-start.x,dy=e.clientY-start.y;
  if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.25||Date.now()-start.time>1600)return;
  stopClip();navigate(dx<0?1:-1);
},{passive:true});
root.addEventListener('pointercancel',function(){swipeStart=null},{passive:true});
})();

document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(tab==='cards'&&vocabMode==='card'&&e.key==='ArrowRight')navigate(1);if(tab==='cards'&&vocabMode==='card'&&e.key==='ArrowLeft')navigate(-1);if(e.key==='Escape'&&tab!=='home'){stopClip();setTab('home')}});

document.getElementById('speedToggle').addEventListener('click',()=>{const p=document.getElementById('speed-panel');p.hidden=!p.hidden;document.getElementById('speedToggle').setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)refreshVoices()});
document.getElementById('speed-slider').addEventListener('input',e=>setSpeed(SPEED_STEPS[Number(e.target.value)]));
document.getElementById('voice-mode').addEventListener('change',e=>{voiceMode=e.target.value;localStorage.setItem('wild-voice-mode',voiceMode);if(activeClip){const k=activeClip.key,rr=isReaderPlayer;stopClip();listen(k,rr)}});
document.getElementById('voice-choice').addEventListener('change',e=>{voiceName=e.target.value;localStorage.setItem('wild-voice-name',voiceName);if(activeClip?.mode==='device')restartNativeAtCurrent()});
initSpeedUI();
setTab('home');</script></body></html>
